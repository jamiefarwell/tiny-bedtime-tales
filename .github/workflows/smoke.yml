name: Tiny Bedtime Tales smoke test

on:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for this exact production deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS --max-time 15 https://tiny-bedtime-tales.vercel.app/api/health -o /tmp/health.json; then
              SHA=$(node -e "process.stdout.write(require('/tmp/health.json').commit||'')")
              if [ "$SHA" = "$GITHUB_SHA" ]; then cat /tmp/health.json; exit 0; fi
            fi
            sleep 10
          done
          echo "Production never reached $GITHUB_SHA"; exit 1

      - name: Library and reader pages render
        shell: bash
        run: |
          set -euo pipefail
          for path in / /library /library/lily-and-the-lantern-feather /read/lily-and-the-lantern-feather /create; do
            curl -fsS --max-time 20 -o /dev/null "https://tiny-bedtime-tales.vercel.app$path"
            echo "ok $path"
          done

      - name: Storyteller writes a real story (when connected)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(node -e "process.stdout.write(String(require('/tmp/health.json').storyteller))")" != "true" ]; then
            echo "Storyteller not connected yet; skipping."; exit 0
          fi
          curl -fsS --max-time 240 -N -X POST https://tiny-bedtime-tales.vercel.app/api/story \
            -H 'Content-Type: application/json' \
            --data '{"child":{"name":"Milo","ageBand":"4–5","pronouns":"he","loves":["Space"],"companions":[],"avoid":[]},"mood":"something really funny","world":"outer space","minutes":5}' \
            -o /tmp/story.ndjson
          node -e "
            const ev=require('fs').readFileSync('/tmp/story.ndjson','utf8').trim().split('\n').map(JSON.parse);
            const pages=ev.filter(e=>e.type==='page'); const done=ev.find(e=>e.type==='done');
            if(!done||pages.length<4) throw new Error('Story incomplete: '+JSON.stringify(ev.slice(-2)));
            console.log('Story:', ev.find(e=>e.type==='meta')?.title, '| pages', pages.length, '| model', done.model);
          "
