<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173a4a"/>
      <stop offset="1" stop-color="#0f2533"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef2"/>
      <stop offset="1" stop-color="#b7c3cc"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset=".5" stop-color="#8d9aa6"/>
      <stop offset="1" stop-color="#dfe5ea"/>
    </linearGradient>
    <radialGradient id="tunnel" cx="50%" cy="55%" r="60%">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset=".35" stop-color="#f6c25b"/>
      <stop offset=".75" stop-color="#b66a2a"/>
      <stop offset="1" stop-color="#3a2014"/>
    </radialGradient>
    <clipPath id="port"><circle cx="200" cy="212" r="104"/></clipPath>
  </defs>

  <rect width="400" height="500" fill="url(#wall)"/>
  <g stroke="#1f4a5c" stroke-width="2" opacity=".6">
    <path d="M0 60 H400 M0 120 H400 M0 180 H400 M0 240 H400 M0 300 H400 M0 360 H400 M0 420 H400"/>
    <path d="M80 0 V500 M160 0 V500 M240 0 V500 M320 0 V500"/>
  </g>

  <!-- Washing machine -->
  <rect x="56" y="48" width="288" height="360" rx="26" fill="url(#body)"/>
  <rect x="56" y="48" width="288" height="56" rx="26" fill="#d6dee4"/>
  <rect x="56" y="80" width="288" height="24" fill="#d6dee4"/>
  <circle cx="300" cy="76" r="12" fill="#9aa7b2"/>
  <rect x="90" y="68" width="70" height="14" rx="7" fill="#9aa7b2"/>
  <circle cx="200" cy="212" r="128" fill="url(#ring)"/>
  <circle cx="200" cy="212" r="112" fill="#2b3a44"/>

  <!-- Inside: the Lost Things Line -->
  <g clip-path="url(#port)">
    <circle cx="200" cy="212" r="104" fill="url(#tunnel)"/>
    <g stroke="#7a4a24" stroke-width="3" opacity=".7" fill="none">
      <ellipse cx="200" cy="232" rx="60" ry="34"/><ellipse cx="200" cy="232" rx="110" ry="62"/>
    </g>
    <path d="M90 282 Q200 236 310 282" stroke="#5a3a22" stroke-width="6" fill="none"/>
    <path d="M90 290 Q200 244 310 290" stroke="#5a3a22" stroke-width="3" fill="none" opacity=".7"/>
    <!-- matchbox train -->
    <g>
      <rect x="128" y="244" width="40" height="24" rx="3" fill="#e05a47"/>
      <rect x="132" y="238" width="32" height="8" rx="2" fill="#f2d48a"/>
      <rect x="172" y="240" width="44" height="26" rx="3" fill="#3f8fa8"/>
      <rect x="178" y="246" width="12" height="10" rx="1" fill="#ffe7a8"/>
      <rect x="196" y="246" width="12" height="10" rx="1" fill="#ffe7a8"/>
      <rect x="220" y="236" width="50" height="30" rx="4" fill="#2f5d4b"/>
      <rect x="252" y="224" width="12" height="16" rx="2" fill="#2f5d4b"/>
      <rect x="228" y="242" width="16" height="12" rx="2" fill="#ffe7a8"/>
      <g fill="#1b1b24">
        <circle cx="138" cy="270" r="5"/><circle cx="158" cy="270" r="5"/>
        <circle cx="182" cy="268" r="5"/><circle cx="206" cy="268" r="5"/>
        <circle cx="232" cy="268" r="6"/><circle cx="258" cy="268" r="6"/>
      </g>
      <g fill="#fff3d4" opacity=".7">
        <circle cx="262" cy="212" r="6"/><circle cx="270" cy="198" r="8"/><circle cx="282" cy="182" r="10"/>
      </g>
    </g>
    <!-- Tumble the conductor sock -->
    <g transform="translate(96 168)">
      <path d="M18 0 h26 v54 q0 18 -18 18 h-18 q-10 0 -10 -10 q0 -10 10 -10 h10 z" fill="#3fb6b0"/>
      <g fill="#f08a3c">
        <rect x="18" y="10" width="26" height="8"/><rect x="18" y="28" width="26" height="8"/><rect x="18" y="46" width="26" height="8"/>
      </g>
      <rect x="14" y="-8" width="34" height="10" rx="3" fill="#d9a641"/>
      <rect x="22" y="-14" width="18" height="8" rx="3" fill="#d9a641"/>
      <circle cx="26" cy="22" r="2.6" fill="#1b1b24"/><circle cx="36" cy="22" r="2.6" fill="#1b1b24"/>
      <path d="M25 30 q6 5 12 0" stroke="#1b1b24" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <circle cx="200" cy="212" r="104" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"/>
  <path d="M120 150 q30 -40 80 -46" stroke="#fff" stroke-opacity=".35" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Maya peeping in -->
  <g>
    <circle cx="352" cy="300" r="34" fill="#2b1a12"/>
    <circle cx="384" cy="282" r="18" fill="#2b1a12"/>
    <circle cx="340" cy="270" r="18" fill="#2b1a12"/>
    <ellipse cx="350" cy="316" rx="26" ry="28" fill="#8a5a3c"/>
    <circle cx="340" cy="312" r="4" fill="#1b1b24"/><circle cx="360" cy="312" r="4" fill="#1b1b24"/>
    <ellipse cx="350" cy="330" rx="6" ry="4" fill="#5a2f22"/>
    <path d="M300 500 Q350 340 400 360 V500 Z" fill="#e7b12f"/>
    <g fill="#fff6dc"><circle cx="340" cy="420" r="4"/><circle cx="372" cy="398" r="3"/><circle cx="356" cy="460" r="3.5"/></g>
  </g>
</svg>
