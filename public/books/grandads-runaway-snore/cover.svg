<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b45"/>
      <stop offset=".55" stop-color="#2e3a7c"/>
      <stop offset="1" stop-color="#5a4f8f"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset=".3" stop-color="#ffe2a8" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffc46b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="snore" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#d6e0f5"/>
      <stop offset=".55" stop-color="#9fb2d9"/>
      <stop offset="1" stop-color="#6f83b3"/>
    </radialGradient>
    <radialGradient id="win" cx="50%" cy="60%" r="70%">
      <stop offset="0" stop-color="#ffe9b0"/>
      <stop offset="1" stop-color="#f2a640"/>
    </radialGradient>
    <radialGradient id="spill" cx="50%" cy="0%" r="100%">
      <stop offset="0" stop-color="#ffc46b" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffc46b" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <rect width="400" height="500" fill="url(#sky)"/>
  <g fill="#fff7e2">
    <circle cx="40" cy="44" r="1.6"/><circle cx="92" cy="90" r="1.1"/><circle cx="150" cy="30" r="1.4"/>
    <circle cx="214" cy="70" r="1"/><circle cx="262" cy="22" r="1.6"/><circle cx="352" cy="118" r="1.2"/>
    <circle cx="24" cy="150" r="1"/><circle cx="120" cy="160" r="1.3" opacity=".7"/><circle cx="380" cy="40" r="1"/>
    <circle cx="300" cy="160" r="1" opacity=".6"/><circle cx="66" cy="210" r="1.2" opacity=".6"/>
  </g>
  <circle cx="318" cy="78" r="70" fill="url(#moon)"/>
  <circle cx="318" cy="78" r="22" fill="#fff4d6"/>

  <!-- The Snore, drifting up out of the chimney -->
  <g filter="url(#soft)" opacity=".85" fill="#b9c7e4">
    <circle cx="176" cy="246" r="7"/><circle cx="160" cy="262" r="5"/><circle cx="150" cy="282" r="3.5"/>
  </g>
  <g>
    <g fill="url(#snore)">
      <circle cx="178" cy="176" r="46"/>
      <circle cx="232" cy="164" r="52"/>
      <circle cx="284" cy="186" r="40"/>
      <circle cx="206" cy="210" r="42"/>
      <circle cx="258" cy="216" r="40"/>
      <circle cx="146" cy="206" r="30"/>
      <circle cx="304" cy="220" r="26"/>
    </g>
    <g fill="#e8eefb" opacity=".55">
      <circle cx="214" cy="140" r="18"/><circle cx="170" cy="160" r="12"/><circle cx="262" cy="150" r="10"/>
    </g>
    <!-- sleepy eyes -->
    <path d="M196 196 q12 9 24 0" fill="none" stroke="#2c2f5a" stroke-width="5" stroke-linecap="round"/>
    <path d="M246 196 q12 9 24 0" fill="none" stroke="#2c2f5a" stroke-width="5" stroke-linecap="round"/>
    <path d="M194 188 q14 -6 28 0 M244 188 q14 -6 28 0" fill="none" stroke="#7c8fbf" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <ellipse cx="190" cy="214" rx="9" ry="5" fill="#f2a6b6" opacity=".45"/>
    <ellipse cx="278" cy="214" rx="9" ry="5" fill="#f2a6b6" opacity=".45"/>
  </g>

  <!-- Rooftops -->
  <path d="M0 330 L60 290 L120 330 L120 300 L180 262 L240 300 L240 318 L300 282 L360 318 L400 296 L400 500 L0 500 Z" fill="#141836"/>
  <rect x="160" y="250" width="24" height="44" fill="#141836"/>
  <rect x="156" y="244" width="32" height="10" rx="2" fill="#1d2248"/>
  <rect x="318" y="268" width="18" height="34" fill="#141836"/>
  <rect x="60" y="300" width="16" height="22" fill="#141836"/>

  <!-- Windows -->
  <rect x="34" y="372" width="34" height="44" rx="4" fill="#22285a"/>
  <rect x="320" y="356" width="34" height="44" rx="4" fill="#22285a"/>
  <rect x="152" y="340" width="60" height="74" rx="6" fill="url(#win)"/>
  <path d="M182 340 V414 M152 376 H212" stroke="#c9802f" stroke-width="3"/>
  <!-- Nell, peering up -->
  <g fill="#7a3f1e" opacity=".8">
    <circle cx="196" cy="386" r="11"/>
    <circle cx="196" cy="370" r="8"/>
    <path d="M182 414 q14 -22 28 0z"/>
  </g>
  <rect x="140" y="414" width="84" height="8" rx="3" fill="#2a2f62"/>
  <path d="M140 422 L224 422 L260 500 L104 500 Z" fill="url(#spill)" opacity=".5"/>
</svg>
